<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-анализатор конкурентов</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>AI-анализатор рынка конкурентов</h1>
        <p class="subtitle">Ниша: графический дизайн и анимация</p>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('text')">Анализ текста</button>
            <button class="tab-btn" onclick="openTab('image')">Анализ изображения</button>
            <button class="tab-btn" onclick="openTab('parse')">Парсинг сайтов</button>
        </div>
        
        <div id="text" class="tab-content active">
            <h2>Анализ текстового описания конкурента</h2>
            <textarea id="textInput" placeholder="Вставьте описание конкурента, текст с лендинга или страницы конкурента..."></textarea>
            <button onclick="analyzeText()">Анализировать</button>
            <h3>Результат анализа</h3>
            <div id="textResult" class="result-container"></div>
        </div>
        
        <div id="image" class="tab-content">
            <h2>Анализ изображения / скриншота лендинга</h2>
            <input type="file" id="imageFile" accept="image/*">
            <button onclick="analyzeImage()">Анализировать изображение</button>
            <h3>Результат анализа</h3>
            <div id="imageResult" class="result-container"></div>
        </div>
        
        <div id="parse" class="tab-content">
            <h2>Автоматический парсинг сайтов конкурентов</h2>
            <button onclick="runParse()">Запустить парсинг (/parsedemo)</button>
            <button onclick="getHistory()">Показать историю парсинга</button>
            <h3>Результаты парсинга</h3>
            <div id="parseResult" class="result-container"></div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
